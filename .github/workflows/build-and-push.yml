name: Build and Push Images to GHCR

# Воркфлоу запускается автоматически при каждом пуше в ветку main (или master)
on:
  push:
    branches:
      - main
      - master

# Выдаем права для использования встроенного GITHUB_TOKEN для работы с пакетами
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Скачиваем исходный код проекта на сервер GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Инициализируем Buildx (продвинутый сборщик Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Логинимся в GitHub Container Registry с помощью встроенного токена
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Переводим имя репозитория в нижний регистр (требование Docker)
      - name: Downcase repo string
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # Step 5: Собираем и пушим Бэкенд
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/backend:latest

      # Step 6: Собираем и пушим Фронтенд
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/frontend:latest

      # Step 7: Собираем и пушим Nginx
      - name: Build and push Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/nginx:latest
